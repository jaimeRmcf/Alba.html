    min-height:100%;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse at 15% 8%, rgba(232,197,121,.10), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(233,145,176,.12), transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    font-family:'Cormorant Garamond', serif;
    color:var(--white);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== foto de fondo ===== */
  .bg-photo{
    position:fixed; inset:0;
    background-image:
      linear-gradient(180deg, rgba(7,5,15,.55) 0%, rgba(7,5,15,.78) 55%, rgba(7,5,15,.95) 100%),
      var(--bg-photo-url);
    background-size:cover;
    background-position:center;
    filter:saturate(.8);
    z-index:-1;
  }

  /* ===== cielo ===== */
  .sky{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .star{
    position:absolute;
    background:var(--white);
    border-radius:50%;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; }
    50%{ opacity:.9; }
  }
  .moon{
    position:fixed; top:6vh; right:8vw;
    width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fffaf0, var(--gold-soft) 60%, transparent 75%);
    box-shadow:0 0 40px rgba(244,223,165,.35);
    z-index:0; pointer-events:none;
  }

  .shoot{
    position:fixed;
    width:2px; height:2px;
    border-radius:50%;
    background:var(--gold-soft);
    box-shadow:0 0 6px 2px rgba(244,223,165,.8);
    z-index:5;
    pointer-events:none;
  }

  /* ===== layout ===== */
  .wrap{
    position:relative; z-index:1;
    max-width:520px;
    margin:0 auto;
    padding:9vh 7vw 12vh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .kicker{
    font-style:italic;
    font-size:15px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--pink);
    opacity:0;
    animation:reveal .9s ease forwards .1s;
  }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:clamp(26px,6.2vw,36px);
    line-height:1.15;
    margin:16px 0 10px;
    opacity:0;
    background:linear-gradient(100deg, var(--white) 20%, var(--gold) 45%, var(--pink) 65%, var(--white) 85%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:reveal .9s ease forwards .3s, shimmer 8s linear infinite 1.2s;
  }
  @keyframes shimmer{ 0%{background-position:0% 0;} 100%{background-position:250% 0;} }

  .intro-text{
    font-size:18px;
    line-height:1.55;
    color:#cfc9e6;
    max-width:34ch;
    margin-bottom:6px;
    opacity:0;
    animation:reveal .9s ease forwards .5s;
  }

  @keyframes reveal{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* ===== constelación ===== */
  .constellation{
    width:min(320px, 78vw);
    margin:6vh 0 3vh;
    opacity:0;
    animation:reveal 1s ease forwards .8s;
    position:relative;
  }
  svg{ width:100%; height:auto; overflow:visible; }

  .star-node{ cursor:pointer; transition:r .2s ease; }
  .star-node.locked{ cursor:default; }
  .star-node.pulse{ animation:pulseNode 1.8s ease-in-out infinite; }
  @keyframes pulseNode{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.35); }
  }

  .status-text{
    font-size:14px;
    letter-spacing:.03em;
    color:#a79fc9;
    opacity:0;
    animation:reveal .9s ease forwards 1s;
    min-height:20px;
  }

  /* ===== overlay tarjeta ===== */
  .overlay{
    position:fixed; inset:0;
    display:none;
    align-items:center; justify-content:center;
    padding:6vw;
    z-index:20;
  }
  .overlay.open{ display:flex; }
  .overlay::before{
    content:""; position:absolute; inset:0;
    background:rgba(4,3,10,.88);
    backdrop-filter:blur(6px);
  }
  .card{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background:var(--card);
    border:1px solid rgba(244,223,165,.18);
    border-radius:20px;
    padding:38px 28px;
    text-align:center;
    animation:cardIn .45s cubic-bezier(.4,0,.2,1);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(18px) scale(.95); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .card .star-mark{
    font-size:26px;
    display:block;
    margin-bottom:6px;
    color:var(--gold);
    animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ 0%{transform:scale(0);} 70%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .card .tag{
    font-style:italic; font-size:14px; letter-spacing:.04em;
    color:var(--pink); margin-bottom:14px;
  }
  .card .message{
    font-family:'Playfair Display', serif;
    font-weight:500; font-style:italic;
    font-size:22px; line-height:1.45;
    margin-bottom:20px;
  }
  .card .divider{
    width:34px; height:1px;
    background:var(--gold);
    margin:0 auto 18px;
    opacity:.6;
  }
  .card .unlock-msg{
    font-size:17px;
    color:#e4dcff;
    line-height:1.5;
    margin-bottom:8px;
  }
  .btn{
    margin-top:14px;
    background:linear-gradient(135deg, var(--pink), #b5457a);
    color:var(--white);
    border:none;
    border-radius:999px;
    padding:12px 34px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    letter-spacing:.03em;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(233,145,176,.3);
    transition:transform .15s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn:disabled{ opacity:.4; }

  .card input[type="text"]{
    width:100%;
    background:rgba(255,255,255,.04);
    border:none;
    border-bottom:1.5px solid rgba(244,223,165,.35);
    color:var(--white);
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    padding:10px 6px;
    text-align:center;
    outline:none;
    margin-bottom:8px;
    border-radius:6px 6px 0 0;
    transition:border-color .2s ease;
  }
  .card input[type="text"]:focus{ border-color:var(--pink); }
  .card input[type="text"]::placeholder{ color:rgba(244,223,165,.4); }
  .card input.shake{ animation:shake .4s ease; border-color:var(--pink); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .feedback{
    font-size:15px;
    min-height:20px;
    margin:8px 0 6px;
    color:var(--pink);
  }
  .link-row{
    margin-top:14px;
    display:flex;
    justify-content:center;
    gap:18px;
  }
  .link-row button{
    background:none; border:none;
    color:#cfc9e6;
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-size:14px;
    text-decoration:underline;
    cursor:pointer;
  }

  /* ===== finale ===== */
  .finale{ display:none; }
  .finale.show{
    display:flex; flex-direction:column; align-items:center;
  }
  .finale .big-heart{
    font-size:42px; margin-bottom:8px;
    color:var(--pink);
    animation:pop .6s cubic-bezier(.34,1.56,.64,1);
  }

  .confetti-star{
    position:fixed; top:50%; left:50%;
    font-size:16px; pointer-events:none; z-index:25;
    animation:burst 1.7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes burst{
    to{ transform:translate(var(--bx), var(--by)) rotate(var(--brot)); opacity:0; }
  }

  .close-x{
    position:absolute; top:14px; right:18px;
    background:none; border:none;
    color:#cfc9e6; font-size:24px;
    cursor:pointer; z-index:2; line-height:1;
  }
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="sky" id="sky"></div>
<div class="moon"></div>

<div class="wrap" id="mainWrap">
  <div class="kicker">para ti, en nuestro día</div>
  <h1>Por muchos cumples más juntos,<br>te quiero torbellino</h1>
  <p class="intro-text">Cada estrella guarda un motivo y algo más bonito.</p>

  <div class="constellation">
    <svg viewBox="0 0 32 30" id="heartSvg">
      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="0.9" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e8c579"/>
          <stop offset="100%" stop-color="#e991b0"/>
        </linearGradient>
      </defs>
      <path id="heartGuide" d="M16,29.3C16,29.3,0,19.9,0,9.3C0,4.2,3.9,0,8.7,0c3.1,0,5.8,1.8,7.3,4.5C17.5,1.8,20.2,0,23.3,0C28.1,0,32,4.2,32,9.3C32,19.9,16,29.3,16,29.3z"
        fill="none" stroke="rgba(244,223,165,.16)" stroke-width="0.5"/>
      <path id="heartProgress" d="M16,29.3C16,29.3,0,19.9,0,9.3C0,4.2,3.9,0,8.7,0c3.1,0,5.8,1.8,7.3,4.5C17.5,1.8,20.2,0,23.3,0C28.1,0,32,4.2,32,9.3C32,19.9,16,29.3,16,29.3z"
        fill="none" stroke="url(#lineGrad)" stroke-width="0.6" filter="url(#glow)"/>
      <g id="starsGroup"></g>
    </svg>
  </div>

  <div class="status-text" id="statusText">Toca la primera estrella</div>
</div>

<div class="wrap finale" id="finale">
  <div class="big-heart">&#10084;</div>
  <div class="kicker">está completo</div>
  <h1>Así de lleno<br>lo tengo</h1>
  <p class="intro-text">Esto es solo el principio de hoy. Feliz día — te quiero.</p>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <button class="close-x" id="closeBtn">&times;</button>

    <div id="questionView">
      <div class="tag" id="qTag">Estrella 1 de 5</div>
      <div class="message" id="qText"></div>
      <input type="text" id="answerInput" placeholder="tu respuesta...">
      <div class="feedback" id="feedback"></div>
      <button class="btn" id="submitBtn">Comprobar</button>
      <div class="link-row">
        <button id="hintBtn">necesito una pista</button>
      </div>
    </div>

    <div id="unlockView" style="display:none;">
      <span class="star-mark">&#10022;</span>
      <div class="tag" id="cardTag">¡Correcto!</div>
      <div class="unlock-msg" id="cardUnlock"></div>
      <button class="btn" id="closeCardBtn">Seguir</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   EDITA AQUÍ TUS 5 ESTRELLAS
   question: la pregunta (la respuesta es el propio regalo, sin decirlo antes)
   answers:  respuestas válidas, en minúsculas
   hint:     pista opcional
   unlock:   solo la ubicación, sin repetir qué es el regalo
========================================================= */
const gifts = [
  {
    question: "¿Qué es el regalo que más me has pedido?",
    answers: ["flores", "unas flores", "un ramo de flores"],
    hint: "Algo que se marchita pero que siempre pides",
    unlock: "Está en el maletero."
  },
  {
    question: "¿Cuántos años tiene tu hijo?",
    answers: ["3", "tres"],
    hint: "Pregúntale a Jaime si te atascas",
    unlock: "Están en la guantera."
  },
  {
    question: "¿Cuál es tu chocolatina favorita?",
    answers: ["happy hippo", "happie hippo", "hippo"],
    hint: "Pregúntale a Jaime si te atascas",
    unlock: "Está detrás de tu asiento."
  },
  {
    question: "¿Cuál fue nuestra primera cita?",
    answers: ["dar un paseo", "un paseo", "paseo", "pasear"],
    hint: "Pregúntale a Jaime si te atascas",
    unlock: "Está detrás de mi asiento."
  },
  {
    question: "¿Quién fue la primera en lanzarse?",
    answers: ["alba"],
    hint: "Pregúntale a Jaime si te atascas",
    unlock: "Está en el maletero, en el compartimento de la rueda."
  }
];

let unlocked = new Array(gifts.length).fill(false);
let activeIndex = null;
let heartLength = 0;
let starPoints = [];

const svg = document.getElementById('heartSvg');
const heartGuide = document.getElementById('heartGuide');
const heartProgress = document.getElementById('heartProgress');
const starsGroup = document.getElementById('starsGroup');
const statusText = document.getElementById('statusText');
const overlay = document.getElementById('overlay');
const questionView = document.getElementById('questionView');
const unlockView = document.getElementById('unlockView');
const qTag = document.getElementById('qTag');
const qText = document.getElementById('qText');
const answerInput = document.getElementById('answerInput');
const feedback = document.getElementById('feedback');
const cardTag = document.getElementById('cardTag');
const cardUnlock = document.getElementById('cardUnlock');
const mainWrap = document.getElementById('mainWrap');
const finale = document.getElementById('finale');

function normalize(str){
  return str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* ---- progreso guardado (por si cierra la página) ---- */
function loadProgress(){
  try{
    const saved = JSON.parse(localStorage.getItem('constelacion-progreso-v2'));
    if(Array.isArray(saved) && saved.length === gifts.length) unlocked = saved;
  }catch(e){ /* sin almacenamiento disponible, se sigue sin guardar */ }
}
function saveProgress(){
  try{ localStorage.setItem('constelacion-progreso-v2', JSON.stringify(unlocked)); }
  catch(e){ /* no pasa nada si no se puede guardar */ }
}

function isAvailable(i){ return i === 0 || unlocked[i-1]; }

/* ---- cielo estrellado de fondo ---- */
function initSky(){
  const sky = document.getElementById('sky');
  const total = 70;
  for(let i=0;i<total;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random()*2;
    s.style.width = s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDuration = (2+Math.random()*4)+'s';
    s.style.animationDelay = (-Math.random()*5)+'s';
    sky.appendChild(s);
  }
}

/* ---- estrella fugaz al tocar el fondo ---- */
document.body.addEventListener('click', (e) => {
  if(e.target.closest('.constellation') || e.target.closest('.overlay')) return;
  spawnShootingStar(e.clientX, e.clientY);
});
function spawnShootingStar(x, y){
  const s = document.createElement('div');
  s.className = 'shoot';
  s.style.left = x+'px';
  s.style.top = y+'px';
  document.body.appendChild(s);
  const dx = (Math.random()*160-80);
  const dy = 90 + Math.random()*60;
  s.animate([
    { transform:'translate(0,0)', opacity:1 },
    { transform:`translate(${dx}px, ${dy}px)`, opacity:0 }
  ], { duration:700, easing:'ease-out' });
  setTimeout(() => s.remove(), 700);
}

/* ---- construir constelación ---- */
function buildConstellation(){
  heartLength = heartGuide.getTotalLength();
  heartProgress.style.strokeDasharray = heartLength;
  heartProgress.style.strokeDashoffset = heartLength;

  starPoints = gifts.map((_, i) => {
    const frac = (i+1) / gifts.length;
    return heartGuide.getPointAtLength(frac * heartLength);
  });

  starsGroup.innerHTML = "";
  starPoints.forEach((pt, i) => {
    const hit = document.createElementNS('http://www.w3.org/2000/svg','circle');
    hit.setAttribute('cx', pt.x);
    hit.setAttribute('cy', pt.y);
    hit.setAttribute('r', 2.4);
    hit.setAttribute('fill', 'transparent');
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', (e) => { e.stopPropagation(); onStarTap(i); });

    const node = document.createElementNS('http://www.w3.org/2000/svg','circle');
    node.setAttribute('cx', pt.x);
    node.setAttribute('cy', pt.y);
    node.setAttribute('id', 'star-'+i);
    node.setAttribute('class', 'star-node');
    node.style.transformOrigin = `${pt.x}px ${pt.y}px`;

    starsGroup.appendChild(hit);
    starsGroup.appendChild(node);
  });

  refreshVisuals();
}

function refreshVisuals(){
  const count = unlocked.filter(Boolean).length;
  heartProgress.style.transition = 'stroke-dashoffset 1s ease';
  heartProgress.style.strokeDashoffset = heartLength * (1 - count/gifts.length);

  gifts.forEach((_, i) => {
    const node = document.getElementById('star-'+i);
    node.classList.remove('pulse');
    if(unlocked[i]){
      node.setAttribute('r', 1.1);
      node.setAttribute('fill', '#f4dfa5');
      node.setAttribute('filter', 'url(#glow)');
      node.classList.remove('locked');
    } else if(isAvailable(i)){
      node.setAttribute('r', 1);
      node.setAttribute('fill', '#f6f2ff');
      node.removeAttribute('filter');
      node.classList.remove('locked');
      node.classList.add('pulse');
    } else {
      node.setAttribute('r', 0.7);
      node.setAttribute('fill', '#4a4560');
      node.removeAttribute('filter');
      node.classList.add('locked');
    }
  });

  if(count === gifts.length){
    statusText.textContent = "";
    setTimeout(() => {
      mainWrap.style.display = 'none';
      finale.classList.add('show');
      launchConfetti();
    }, 700);
  } else {
    const next = count;
    statusText.textContent = count === 0
      ? "Toca la primera estrella"
      : `Estrella ${next+1} te espera`;
  }
}

function onStarTap(i){
  activeIndex = i;
  if(unlocked[i]){
    showUnlockView(i);
    overlay.classList.add('open');
    return;
  }
  if(!isAvailable(i)){
    statusText.textContent = "Completa antes la estrella anterior";
    statusText.style.color = 'var(--pink)';
    setTimeout(() => {
      statusText.style.color = '';
      refreshVisuals();
    }, 1300);
    return;
  }
  openQuestion(i);
}

function openQuestion(i){
  questionView.style.display = 'block';
  unlockView.style.display = 'none';
  qTag.textContent = `Estrella ${i+1} de ${gifts.length}`;
  qText.textContent = gifts[i].question;
  answerInput.value = "";
  feedback.textContent = "";
  overlay.classList.add('open');
  setTimeout(() => answerInput.focus(), 100);
}

function showUnlockView(i){
  questionView.style.display = 'none';
  unlockView.style.display = 'block';
  cardTag.textContent = "¡Correcto!";
  cardUnlock.textContent = gifts[i].unlock;
}

document.getElementById('submitBtn').addEventListener('click', checkAnswer);
answerInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkAnswer(); });

function checkAnswer(){
  const val = normalize(answerInput.value);
  const g = gifts[activeIndex];
  const correct = g.answers.some(a => normalize(a) === val);
  if(correct){
    unlocked[activeIndex] = true;
    saveProgress();
    showUnlockView(activeIndex);
  } else {
    feedback.textContent = "No es eso... inténtalo otra vez";
    answerInput.classList.remove('shake');
    void answerInput.offsetWidth;
    answerInput.classList.add('shake');
    answerInput.value = "";
  }
}

document.getElementById('hintBtn').addEventListener('click', () => {
  feedback.style.color = 'var(--gold)';
  feedback.textContent = "Pista: " + gifts[activeIndex].hint;
});

document.getElementById('closeBtn').addEventListener('click', closeCard);
document.getElementById('closeCardBtn').addEventListener('click', closeCard);
function closeCard(){
  overlay.classList.remove('open');
  feedback.style.color = 'var(--pink)';
  refreshVisuals();
}

function launchConfetti(){
  const symbols = ['&#10084;','&#10022;','&#9733;'];
  const total = 28;
  for(let i=0;i<total;i++){
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-star';
      el.innerHTML = symbols[Math.floor(Math.random()*symbols.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 110 + Math.random()*180;
      el.style.setProperty('--bx', Math.cos(angle)*dist+'px');
      el.style.setProperty('--by', Math.sin(angle)*dist+'px');
      el.style.setProperty('--brot', (Math.random()*360-180)+'deg');
      el.style.color = Math.random() > .5 ? 'var(--gold)' : 'var(--pink)';
      el.style.fontSize = (13+Math.random()*14)+'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }, i*35);
  }
}

initSky();
loadProgress();
buildConstellation();
</script>

</body>
</html>
